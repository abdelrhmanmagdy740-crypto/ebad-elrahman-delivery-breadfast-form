<!-- Document Uploads (6 to 11) with Camera & Gallery Support -->
<div class="border-t border-gray-700 pt-6">
    <h3 class="text-lg font-bold text-neonOrange mb-2"><i class="fa-solid fa-camera ml-2"></i> المستندات المطلوبة (يمكنك التصوير بالكاميرا أو الرفع من المعرض)</h3>
    <p class="text-xs text-gray-400 mb-4">عند الضغط على أي خانة، ستظهر لك خيارات (التقاط بالكاميرا أو اختيار صورة من الجهاز).</p>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">6. بطاقة شخصية (الأمامية)</label>
            <input type="file" name="idFront" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonPink file:text-white hover:file:bg-pink-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">7. بطاقة شخصية (الخلفية)</label>
            <input type="file" name="idBack" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonPink file:text-white hover:file:bg-pink-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">8. رخصة القيادة (الأمامية)</label>
            <input type="file" name="licenseFront" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonOrange file:text-white hover:file:bg-orange-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">9. رخصة القيادة (الخلفية)</label>
            <input type="file" name="licenseBack" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonOrange file:text-white hover:file:bg-orange-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">10. رخصة المركبة (الأمامية)</label>
            <input type="file" name="vehicleFront" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">11. رخصة المركبة (الخلفية)</label>
            <input type="file" name="vehicleBack" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 bg-darkBg border border-gray-700 rounded-xl p-2">
        </div>
    </div>
</div>
